<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Must track --color-base in src/styles/tailwind.css. -->
    <meta name="theme-color" content="#161b26" />
    <title>代码哲学 — 为游戏工程提供运行时基础设施</title>
    <meta
      name="description"
      content="代码哲学（Code Philosophy）为游戏行业提供深度技术解决方案：HybridCLR 原生 C# 热更新、LeanCLR 轻量跨平台 CLR、ZLua / ZenTS 脚本方案、Luban 配置工作流、Obfuz 代码加固。"
    />

    <script>
      // Single Page Apps for GitHub Pages — decode step.
      // public/404.html rewrites /hybridclr to /?/hybridclr; restore it here
      // so history-mode routing survives a hard refresh or deep link.
      ;(function () {
        var l = window.location
        if (l.search[1] !== '/') return
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        )
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
